<script>
    (() => {
        const storageKey = 'pm2dash-theme';

        function getSavedTheme() {
            try {
                const savedTheme = localStorage.getItem(storageKey);
                if (savedTheme === 'light' || savedTheme === 'dark') return savedTheme;
            } catch (error) {
                // 저장소를 사용할 수 없는 환경에서는 시스템 설정을 사용합니다.
            }
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }

        function applyTheme(theme, persist = false) {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;

            if (persist) {
                try {
                    localStorage.setItem(storageKey, theme);
                } catch (error) {
                    // 저장 실패 시에도 현재 페이지의 테마 전환은 유지합니다.
                }
            }

            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.setAttribute('aria-pressed', String(theme === 'dark'));
                toggle.setAttribute('aria-label', `현재 ${theme === 'dark' ? '다크' : '화이트'} 모드. 테마 변경`);
            }

            window.dispatchEvent(new CustomEvent('pm2dash:themechange', { detail: { theme } }));
        }

        window.PM2DashTheme = { apply: applyTheme, current: getSavedTheme };
        applyTheme(getSavedTheme());

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(document.documentElement.dataset.theme || getSavedTheme());
            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                applyTheme(nextTheme, true);
            });
        });
    })();
</script>
